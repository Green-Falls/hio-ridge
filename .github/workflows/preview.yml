# Client preview on GitHub Pages at https://green-falls.github.io/hio-ridge/ : every page noindex,
# links relative so the site works under the /hio-ridge/ path. No custom domain until the DNS CNAME
# for hioridge.greenfalls.co exists; then switch the build line to PREVIEW_HOST=hioridge.greenfalls.co.
# If the first run fails at "configure-pages", enable Pages once: Settings → Pages → Source: GitHub Actions.
name: preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hio-ridge-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: node scripts/check-content.js
      - run: RELATIVE=1 node build.mjs
      - run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
